name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Check out the exact classic-BPF mechanism source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          repository: chenty2333/thekernel-ax
          ref: 5c34536fd766b5f84f2fb8e6b18a2ab340659582
          path: .ci-deps/thekernel-ax
      - name: Link the external path dependency
        run: ln -s "$GITHUB_WORKSPACE/.ci-deps/thekernel-ax" "$GITHUB_WORKSPACE/../thekernel-ax"
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.85.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Stable crates minimum supported Rust tests
        run: |
          cargo +1.85.0 test -p thekernel-linux-usercopy --all-features --locked
          cargo +1.85.0 check -p thekernel-linux-usercopy --no-default-features --lib --locked
          cargo +1.85.0 test -p thekernel-linux-vfs --all-features --locked
          cargo +1.85.0 check -p thekernel-linux-vfs --no-default-features --lib --locked
          cargo +1.85.0 test -p thekernel-linux-fd --all-features --locked
          cargo +1.85.0 check -p thekernel-linux-fd --no-default-features --lib --locked
          cargo +1.85.0 test -p thekernel-linux-packet --all-features --locked
          cargo +1.85.0 check -p thekernel-linux-packet --no-default-features --lib --locked

  stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Check out the exact classic-BPF mechanism source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          repository: chenty2333/thekernel-ax
          ref: 5c34536fd766b5f84f2fb8e6b18a2ab340659582
          path: .ci-deps/thekernel-ax
      - name: Link the external path dependency
        run: ln -s "$GITHUB_WORKSPACE/.ci-deps/thekernel-ax" "$GITHUB_WORKSPACE/../thekernel-ax"
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable
          components: clippy,rustfmt
          targets: riscv64gc-unknown-none-elf,loongarch64-unknown-none
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Stable crates release-candidate gate
        env:
          CARGO_TOOLCHAIN: stable
        run: ./scripts/ci.sh

  thekernel-nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Check out the exact classic-BPF mechanism source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          repository: chenty2333/thekernel-ax
          ref: 5c34536fd766b5f84f2fb8e6b18a2ab340659582
          path: .ci-deps/thekernel-ax
      - name: Link the external path dependency
        run: ln -s "$GITHUB_WORKSPACE/.ci-deps/thekernel-ax" "$GITHUB_WORKSPACE/../thekernel-ax"
      - name: Install the classic-BPF package toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.85.0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly-2025-05-20
          components: clippy,rustfmt
          targets: riscv64gc-unknown-none-elf,loongarch64-unknown-none
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Full Linux ABI workspace release-candidate gate
        env:
          CARGO_TOOLCHAIN: nightly-2025-05-20
        run: ./scripts/ci.sh
