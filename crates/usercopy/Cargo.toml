[package]
name = "thekernel-linux-usercopy"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Explicit-context, bounded, fallible user-memory access for no_std Linux ABI kernels"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["kernel", "linux", "no-std", "usercopy"]
categories = ["no-std", "os"]
exclude = ["Cargo.toml.orig", ".cargo_vcs_info.json"]

[features]
default = []
alloc = []

[dependencies]
bytemuck.workspace = true
linux-raw-sys.workspace = true

[dev-dependencies]
bytemuck = { workspace = true, features = ["derive"] }
# Exercise the additive owned APIs in integration tests without making them
# part of the default no-alloc library build.
thekernel-linux-usercopy = { path = ".", features = ["alloc"] }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
