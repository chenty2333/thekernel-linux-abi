[package]
name = "thekernel-linux-signal"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
description = "Bounded signal queues and explicit-usercopy frames for no_std Linux ABI kernels"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["kernel", "linux", "no-std", "signal"]
categories = ["no-std", "os"]
exclude = ["Cargo.toml.orig", ".cargo_vcs_info.json"]

[features]
default = []
multitask = ["dep:axsync", "axsync/multitask"]

[dependencies]
axcpu.workspace = true
bitflags.workspace = true
derive_more.workspace = true
kspin.workspace = true
linux-raw-sys.workspace = true
log.workspace = true
strum.workspace = true
thekernel-linux-usercopy.workspace = true
x86_64.workspace = true

[target.'cfg(target_os = "none")'.dependencies]
axsync = { workspace = true, optional = true }

[package.metadata.docs.rs]
all-features = true

[package.metadata.thekernel]
# The workspace selects the rolling nightly toolchain; this crate only needs
# the allocator_api nightly feature and intentionally does not pin a date.
toolchain = "nightly"
nightly-features = ["allocator_api"]

[lints]
workspace = true
